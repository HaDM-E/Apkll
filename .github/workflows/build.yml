name: Build LiteLoader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o LiteLoader-Android-Project-with-Actions.zip -d project
          find . -name settings.gradle -print

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE" -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Collect APK
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" LiteLoader.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteLoader-APK
          path: LiteLoader.apk
